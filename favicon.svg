<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
  <!-- Heatsink top -->
  <rect x="20" y="10" width="24" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="23" y="17" width="18" height="4" rx="2" fill="#94a3b8"/>
  <rect x="23" y="23" width="18" height="4" rx="2" fill="#64748b"/>
  <!-- Heatblock with screw detail -->
  <rect x="18" y="29" width="28" height="15" rx="3" fill="url(#goldGrad)"/>
  <circle cx="23" cy="36" r="2" fill="#713f12" opacity="0.6"/>
  <!-- Nozzle cone -->
  <path d="M26 44 L38 44 L34 53 L30 53 Z" fill="url(#nozzleGrad)"/>
  <!-- Laser glowing extruded 3D bead -->
  <circle cx="32" cy="56" r="2.5" fill="#38bdf8"/>
</svg>
